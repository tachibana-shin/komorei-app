# SonarQube Cloud — Komorei
#
# Analysis is SonarCloud AUTOMATIC analysis (GitHub App), so this file at the
# repository root is the only lever we have on what gets reported. Every
# exclusion below is argued, not just silenced.

sonar.projectKey=tachibana-shin_komorei-app
sonar.projectName=komorei-app
sonar.organization=tachibana-shin

sonar.sourceEncoding=UTF-8
sonar.java.version=21

# ─── Scope ────────────────────────────────────────────────────────────────
# Only our own Kotlin sources. The Gradle build also produces the uniffi
# bindings (app/build/generated/uniffi/…), Rust artifacts and the bundled
# .krx fixtures — none of it is authored here and all of it is regenerated.
sonar.sources=app/src/main
sonar.tests=app/src/test

sonar.exclusions=app/build/**,\
  build/**,\
  runner/**,\
  **/generated/**,\
  **/jniLibs/**,\
  **/*.jks,\
  **/*.keystore

sonar.coverage.exclusions=app/src/main/**,\
  app/build/**,\
  **/generated/**,\
  **/jniLibs/**

# ─── Exclusions (multi-criteria, one list) ────────────────────────────────
# A Composable reads as a tree of `when`/`if`/slot lambdas by design. S3776
# (cognitive complexity), S107 (arity) and S1172 (unused param) treat that
# tree as nested branching and ask for it to be flattened — but "extracting" a
# branch out of a composable body either changes nothing (the @Composable keeps
# the same nesting) or scatters related UI across extra functions, which is
# strictly worse to read. They fire hardest in the UI layer (PlayerVideoArea
# scored 310, AnimeDetailView 161, PlayerSheets 149) — exactly the signal that
# the metric does not fit the framework.
#
# Scoped to **/ui/** on purpose: the four hits in the data layer
# (UpdateManager x2, BackupSyncWorker, AnimeRepository) are ordinary imperative
# code and DO stay reported.
sonar.issue.ignore.multicriteria=compose-complexity,compose-arity,compose-unused-param,hilt-entrypoints,identity-equality,cleartext-logcat

sonar.issue.ignore.multicriteria.compose-complexity.ruleKey=kotlin:S3776
sonar.issue.ignore.multicriteria.compose-complexity.resourceKey=**/ui/**

sonar.issue.ignore.multicriteria.compose-arity.ruleKey=kotlin:S107
sonar.issue.ignore.multicriteria.compose-arity.resourceKey=**/ui/**

sonar.issue.ignore.multicriteria.compose-unused-param.ruleKey=kotlin:S1172
sonar.issue.ignore.multicriteria.compose-unused-param.resourceKey=**/ui/**

# An @AndroidEntryPoint / @HiltAndroidApp class "has" empty functions because
# the body is generated by the Hilt Gradle plugin. A comment inside the body is
# the idiomatic marker and S1186 asks for exactly that; it is excluded anyway so
# a generated no-op never reads as a forgotten implementation.
sonar.issue.ignore.multicriteria.hilt-entrypoints.ruleKey=kotlin:S1186
sonar.issue.ignore.multicriteria.hilt-entrypoints.resourceKey=**/KomoreiApplication.kt

# S6619 wants value equality on every class. BackupCodec, KrxHostImpl and
# PlayerViewModel are injected singletons that hold no comparable state — two
# instances are never compared, and generating equals/hashCode over their
# constructor params would only make accidental copies look interchangeable.
sonar.issue.ignore.multicriteria.identity-equality.ruleKey=kotlin:S6619
sonar.issue.ignore.multicriteria.identity-equality.resourceKey=\
  **/BackupCodec.kt,\
  **/KrxHostImpl.kt,\
  **/PlayerViewModel.kt

# Cleartext HTTP is deliberate: Advanced → "log server URL" POSTs formatted log
# lines to a `komorei logcat --port` process on the local network
# (http://10.0.2.2:9000 from the emulator). It carries no credentials and no
# user data, and forcing TLS on a developer log sink would break the
# documented workflow. Tracked, not forgotten.
sonar.issue.ignore.multicriteria.cleartext-logcat.ruleKey=xml:S5332
sonar.issue.ignore.multicriteria.cleartext-logcat.resourceKey=app/src/main/AndroidManifest.xml
