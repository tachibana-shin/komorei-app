[package]
name = "komorei-runner"
version = "0.1.0"
description = "Komorei .krx wasm runner (wasmi) bridged to Kotlin via uniffi. Lives in the app repo; pulls the komorei source-API crate from the separate komorei-sdk repo via a relative path."
authors = ["shin"]
edition = "2024"
publish = false

[workspace]
resolver = "3"

[lib]
name = "komorei_runner"
crate-type = ["cdylib", "lib"]

[dependencies]
# komorei-sdk is its own separate repository (kept at ../komorei-sdk); this
# crate is owned by the application repo and reaches the sdk by relative path.
komorei = { path = "../komorei-sdk/crates/lib", default-features = false }
base64 = "0.22"
digest = "0.10"
hmac = "0.12"
md-5 = "0.10"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
uniffi = { version = "0.32.1", features = ["build"] }
# `portable-dispatch` is not optional here, it is the difference between a
# working player and a dead process.
#
# wasmi 2.0 picks its dispatch backend at compile time. With `auto-dispatch` and
# a build it believes supports tail calls, it marks every opcode handler
# `#[inline(never)]` and emits `return handler(..)`, leaving it to LLVM to turn
# that into a sibling call. This crate builds at `opt-level = "s"` with fat LTO,
# and there LLVM does *not* — the chain nests a native frame per executed wasm
# instruction instead. A source doing any real work (AnimeVietsub's playlist
# decryption alone is hundreds of thousands of instructions) then walks the
# worker off the end of its stack and SIGSEGVs the app:
#
#   Cause: stack pointer is not in a rw map; likely due to stack overflow
#   #00 wasmi::...::exec::u32_store_mem0_offset16_sr
#   #01 wasmi::...::exec::i64_store_wrap32_mem0_offset16_rs   (dispatch/backend/tail.rs)
#   #02 wasmi::...::exec::u32_store_mem0_offset16_sr
#   ...
#
# `portable-dispatch` selects the other backend: handlers are `#[inline(always)]`,
# so the dispatch chain is one function and the executor is a loop no matter what
# LLVM decides. It is wasmi's own fallback for targets without tail calls, and
# it is correct on every target — which is what a host that executes untrusted
# `.krx` needs. See also `engine::MAX_RECURSION_DEPTH`, which bounds genuine wasm
# *call* recursion, the one thing this does not cover.
wasmi = { version = "2.0.0", features = ["portable-dispatch"] }

[build-dependencies]
uniffi = { version = "0.32.1", features = ["build"] }

[dev-dependencies]
zip = { version = "4", default-features = false, features = ["deflate"] }

# Size-optimized, stripped builds for the Android jniLibs.
#
# `panic = "unwind"` (was "abort") is REQUIRED for correctness, not a default.
# A `KomoreiHost` callback that violates the FFI contract makes uniffi panic
# under an `extern "C"` frame, which can never be caught — so the primary fix
# is that every trait method returns `Result` (see src/host.rs), and this
# profile is what lets `with_engine`'s `catch_unwind` contain the panics that
# do NOT cross a callback. Under "abort" a single runner bug kills the whole
# host process: an app crash on Android, or a SIGABRT that silently drops
# every later test in the Gradle JVM. The cost is unwinding tables in the
# cdylib plus landing pads; `opt-level`/`lto`/`strip` keep the size hit small.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = "s"
strip = true
lto = true