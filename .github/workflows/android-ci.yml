name: Android CI

on:
  # No `push` trigger on purpose.
  #
  # android-release.yml already runs on every push to main and calls this file as
  # a reusable workflow, so a `push` trigger here meant the whole gate ran twice
  # per commit: once standalone, then again inside the release run. That is a
  # full Rust build, a full Gradle test run and a debug APK, twice, for one
  # commit — and the two copies can disagree, which makes it unclear which one
  # a red build is talking about.
  #
  # Nothing is lost by dropping it: a push to main still runs the gate exactly
  # once, through the release workflow that needs it before it publishes
  # anything. Pull requests still trigger it directly, which is where a
  # standalone run is actually wanted.
  pull_request:
    branches: [main]
  workflow_call:
    # Declared so the release workflow can forward it. A caller that passes a
    # secret the called workflow has not declared is rejected before the run
    # starts, with a bare "workflow file issue" and no log to read.
    #
    # Optional, because a pull request trigger has no caller to forward anything,
    # and a pull request from a fork gets no secrets at all.
    secrets:
      PAT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Komorei
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout komorei-sdk
        uses: actions/checkout@v7
        with:
          repository: tachibana-shin/komorei-sdk
          path: komorei-sdk
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
          # The "Lint runner crate" step below needs both; the pinned toolchain
          # ships without them, so `cargo fmt` / `cargo clippy` fail with
          # "'cargo-fmt' is not installed for the toolchain" until they are
          # requested explicitly.
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
            komorei-sdk/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runner/Cargo.lock', 'komorei-sdk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache installed Cargo binaries
        uses: actions/cache@v6
        with:
          # The `komorei` CLI built below. Keyed on its own source rather than
          # on the lockfiles the cache above uses, so editing the CLI
          # invalidates the binary while an unrelated commit reuses it.
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-komorei-${{ hashFiles('komorei-sdk/Cargo.lock', 'komorei-sdk/crates/cli/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-komorei-

      - name: Lint runner crate
        # --manifest-path WITHOUT --all on purpose: `komorei` is a path
        # dependency into the separate komorei-sdk checkout, and --all would
        # reach across the repo boundary and reformat/lint a repo that has its
        # own CI for exactly that.
        run: |
          cargo fmt --manifest-path runner/Cargo.toml -- --check
          cargo clippy --manifest-path runner/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build SDK example fixture
        run: |
          # `cargo install` recompiles and reinstalls even over a restored
          # binary, so the guard is what saves the time.
          if ! command -v komorei >/dev/null 2>&1; then
            cargo install --path komorei-sdk/crates/cli --locked
          else
            echo "komorei CLI already restored from cache"
          fi
          komorei package komorei-sdk/examples/example-source

      - name: Rust tests
        run: cargo test --manifest-path runner/Cargo.toml --all-targets --locked

  android:
    name: Kotlin / Android tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Komorei
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout komorei-sdk
        uses: actions/checkout@v7
        with:
          repository: tachibana-shin/komorei-sdk
          path: komorei-sdk
          fetch-depth: 0

      - name: Checkout komorei-sources
        uses: actions/checkout@v7
        with:
          repository: tachibana-shin/komorei-sources
          path: sources
          fetch-depth: 0
          # vi.animevietsub lives in a private repository and is pulled in here as
          # a submodule, so this needs a token that can read that repository and
          # the submodules turned on. The default GITHUB_TOKEN is scoped to this
          # repository alone and cannot read a private sibling. Nothing is
          # published from this workflow — the .krx is built only so the source
          # integration tests have a fixture to load.
          #
          # Guarded on the secret existing: this repository is public, so a pull
          # request from a fork runs with no access to secrets at all and the
          # checkout below would fail on a 404 rather than on anything the
          # contributor did. `submodules: false` still gets the public sources
          # repository itself, so a fork PR builds and tests everything that is
          # not private.
          token: ${{ secrets.PAT_TOKEN || '' }}
          submodules: ${{ secrets.PAT_TOKEN != '' }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android SDK packages
        uses: actions/cache@v6
        with:
          # The platforms, build-tools and platform-tools that `sdkmanager` pulls
          # below, which is a few hundred megabytes on every run otherwise, in
          # this job and again in the release job.
          #
          # Only those three subtrees, never `$ANDROID_HOME` wholesale: the
          # action also manages cmdline-tools and its own state, and restoring
          # those over a live install is how this pattern turns into a toolchain
          # that reports a missing package it visibly has.
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/ndk
          # Keyed on the exact package names the install step requests, so a
          # change to either invalidates it by construction. There is no lockfile
          # to hash here: the versions are literals in the step below.
          key: ${{ runner.os }}-android-sdk-buildtools36.0.0-platforms37-ndk28.2.13676358
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Install Android SDK packages
        # Skipped when the cache restored them. `sdkmanager` re-resolves and
        # rewrites the package metadata even when the files are already there,
        # so the guard is what saves the download, not the cache alone.
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37" ] || [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            echo "platforms already restored from cache"
          else
            sdkmanager "platforms;android-37" || sdkmanager "platforms;android-37.0"
          fi
          if [ -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "build-tools already restored from cache"
          else
            sdkmanager "build-tools;36.0.0"
          fi
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "platform-tools already restored from cache"
          else
            sdkmanager "platform-tools"
          fi
          if [ -d "$ANDROID_HOME/ndk/28.2.13676358" ]; then
            echo "ndk already restored from cache"
          else
            sdkmanager "ndk;28.2.13676358"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          # wasm32 for `komorei package` fixtures; the Android triples to
          # cross-compile libkomorei_runner.so for the APK's jniLibs.
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
            komorei-sdk/target
            sources/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runner/Cargo.lock', 'komorei-sdk/Cargo.lock', 'sources/Cargo.lock') }}-androidtargets
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache installed Cargo binaries
        uses: actions/cache@v6
        with:
          # The two binaries `cargo install` produces below. Kept out of the
          # cache above on purpose: that key is the dependency lockfiles, and
          # the uniffi CLI is pinned by a version string that no lockfile in
          # this repository records, so a lockfile-keyed cache could not tell
          # that the pinned version had changed.
          #
          # Keyed on the uniffi version and the SDK CLI's own source, so bumping
          # either rebuilds it while an unrelated commit reuses it. Without this
          # every run compiles uniffi from scratch, which is minutes of the job
          # spent producing a byte-identical binary.
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-uniffi0.32.1-cargondk-${{ hashFiles('komorei-sdk/Cargo.lock', 'komorei-sdk/crates/cli/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-uniffi0.32.1-

      - name: Install native tooling
        run: |
          # The `uniffi-bindgen` binary ships in the `uniffi` crate (there is no
          # `uniffi-bindgen` package on crates.io, and `uniffi_bindgen` is a
          # binless library). The binary is behind the crate's `cli` feature, and
          # the version must stay in lockstep with the runner's `uniffi` dep.
          #
          # Skipped when the cache already restored them. `cargo install` is not
          # cheap and not additive: re-running it over a restored binary still
          # recompiles and reinstalls, so the guard is what actually saves the
          # time, not the cache.
          if ! command -v uniffi-bindgen >/dev/null 2>&1; then
            cargo install uniffi --version 0.32.1 --locked --features cli
          else
            echo "uniffi-bindgen already restored from cache"
          fi
          if ! command -v komorei >/dev/null 2>&1; then
            cargo install --path komorei-sdk/crates/cli --locked
          else
            echo "komorei CLI already restored from cache"
          fi
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          else
            echo "cargo-ndk already restored from cache"
          fi

      - name: Build test fixtures
        run: |
          komorei package komorei-sdk/examples/example-source
          for source in sources/sources/*; do
            [ -d "$source" ] || continue
            [ -f "$source/.skip" ] && continue
            komorei package "$source"
          done

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Kotlin style (ktlint)
        # Style gate for the Kotlin half of the tree, mirroring the runner
        # crate's `cargo fmt` above. Rules live in .editorconfig; run
        # `./gradlew ktlintFormat` locally to fix.
        run: ./gradlew ktlintCheck

      - name: Kotlin unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Android runner native libs
        # Without libkomorei_runner.so in jniLibs the APK still builds and
        # installs, but every source call aborts in the uniffi library load
        # (UnsatisfiedLinkError) and the UI hangs on the loading state.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cd runner
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../app/src/main/jniLibs build -p komorei-runner --release

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: komorei-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
