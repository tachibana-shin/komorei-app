name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Komorei
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout komorei-sdk
        uses: actions/checkout@v7
        with:
          repository: tachibana-shin/komorei-sdk
          path: komorei-sdk
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
            komorei-sdk/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runner/Cargo.lock', 'komorei-sdk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Lint runner crate
        # --manifest-path WITHOUT --all on purpose: `komorei` is a path
        # dependency into the separate komorei-sdk checkout, and --all would
        # reach across the repo boundary and reformat/lint a repo that has its
        # own CI for exactly that.
        run: |
          cargo fmt --manifest-path runner/Cargo.toml -- --check
          cargo clippy --manifest-path runner/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build SDK example fixture
        run: |
          cargo install --path komorei-sdk/crates/cli --locked
          komorei package komorei-sdk/examples/example-source

      - name: Rust tests
        run: cargo test --manifest-path runner/Cargo.toml --all-targets --locked

  android:
    name: Kotlin / Android tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Komorei
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout komorei-sdk
        uses: actions/checkout@v7
        with:
          repository: tachibana-shin/komorei-sdk
          path: komorei-sdk
          fetch-depth: 0

      - name: Checkout komorei-sources
        uses: actions/checkout@v7
        with:
          repository: tachibana-shin/komorei-sources
          path: sources
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0"
          sdkmanager "platforms;android-37" || sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
            komorei-sdk/target
            sources/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runner/Cargo.lock', 'komorei-sdk/Cargo.lock', 'sources/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install native tooling
        run: |
          # The `uniffi-bindgen` binary ships in the `uniffi` crate (there is no
          # `uniffi-bindgen` package on crates.io, and `uniffi_bindgen` is a
          # binless library). The binary is behind the crate's `cli` feature, and
          # the version must stay in lockstep with the runner's `uniffi` dep.
          cargo install uniffi --version 0.32.1 --locked --features cli
          cargo install --path komorei-sdk/crates/cli --locked

      - name: Build test fixtures
        run: |
          komorei package komorei-sdk/examples/example-source
          for source in sources/sources/*; do
            [ -d "$source" ] || continue
            [ -f "$source/.skip" ] && continue
            komorei package "$source"
          done

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Kotlin style (ktlint)
        # Style gate for the Kotlin half of the tree, mirroring the runner
        # crate's `cargo fmt` above. Rules live in .editorconfig; run
        # `./gradlew ktlintFormat` locally to fix.
        run: ./gradlew ktlintCheck

      - name: Kotlin unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: komorei-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
