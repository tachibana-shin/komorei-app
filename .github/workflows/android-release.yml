name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/android-ci.yml
    permissions:
      contents: read
    # A called workflow gets an EMPTY secrets context unless the caller forwards
    # them — the default GITHUB_TOKEN is not a secret and simply is not there.
    # The gate checks out komorei-sources, which has vi.animevietsub as a submodule
    # into a private repository, so it needs PAT_TOKEN. Without this the gate runs
    # with an empty secret, passes an empty `token` to actions/checkout, and fails
    # with "Input required and not supplied: token" — which is not a useful thing
    # to read when the release build looks otherwise fine.
    #
    # Named rather than `secrets: inherit`, so what crosses the boundary is
    # visible here instead of being whatever the repository happens to hold.
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  release:
    name: Build and publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Komorei
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout komorei-sdk
        uses: actions/checkout@v7
        with:
          repository: tachibana-shin/komorei-sdk
          path: komorei-sdk
          fetch-depth: 0

      - name: Checkout komorei-sources
        uses: actions/checkout@v7
        with:
          repository: tachibana-shin/komorei-sources
          path: sources
          fetch-depth: 0
          # vi.animevietsub lives in a private repository and is pulled in here as
          # a submodule, so this needs a token that can read that repository and
          # the submodules turned on. The default GITHUB_TOKEN is scoped to this
          # repository alone and cannot read a private sibling. Nothing is
          # published from this workflow — the .krx is built only so the source
          # integration tests have a fixture to load.
          #
          # Guarded on the secret existing: this repository is public, so a pull
          # request from a fork runs with no access to secrets at all and the
          # checkout below would fail on a 404 rather than on anything the
          # contributor did. `submodules: false` still gets the public sources
          # repository itself, so a fork PR builds and tests everything that is
          # not private.
          token: ${{ secrets.PAT_TOKEN || '' }}
          submodules: ${{ secrets.PAT_TOKEN != '' }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          # Bun's download cache, so `bun ci` for the semantic-release plugins
          # reuses the tarballs instead of fetching them again. Keyed on
          # bun.lock, which is what `bun ci` resolves from.
          #
          # node_modules itself is deliberately not cached: it is small next to
          # the tarballs, and a restored tree that disagrees with the lockfile
          # produces a release step failing for reasons that look like
          # semantic-release's.
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android SDK packages
        uses: actions/cache@v6
        with:
          # The platforms, build-tools and platform-tools that `sdkmanager` pulls
          # below, which is a few hundred megabytes on every run otherwise.
          #
          # Only those three subtrees, never `$ANDROID_HOME` wholesale: the
          # action also manages cmdline-tools and its own state, and restoring
          # those over a live install is how this pattern turns into a toolchain
          # that reports a missing package it visibly has.
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platform-tools
          # Keyed on the exact package names the install step requests, so a
          # change to either invalidates it by construction. There is no lockfile
          # to hash here: the versions are literals in the step below.
          key: ${{ runner.os }}-release-android-sdk-buildtools36.0.0-platforms37
          restore-keys: |
            ${{ runner.os }}-release-android-sdk-

      - name: Install Android SDK packages
        # Skipped when the cache restored them. `sdkmanager` re-resolves and
        # rewrites the package metadata even when the files are already there,
        # so the guard is what saves the download, not the cache alone.
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-37" ] || [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            echo "platforms already restored from cache"
          else
            sdkmanager "platforms;android-37" || sdkmanager "platforms;android-37.0"
          fi
          if [ -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "build-tools already restored from cache"
          else
            sdkmanager "build-tools;36.0.0"
          fi
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "platform-tools already restored from cache"
          else
            sdkmanager "platform-tools"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
          # Not needed by this job today, but kept identical to android-ci.yml
          # so `bun run lint:ci` behaves the same in both — the pinned
          # toolchain does not include these components by default.
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runner/target
            komorei-sdk/target
            sources/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('runner/Cargo.lock', 'komorei-sdk/Cargo.lock', 'sources/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Cache installed Cargo binaries
        uses: actions/cache@v6
        with:
          # The two binaries `cargo install` produces below. Kept out of the
          # cache above on purpose: that key is the dependency lockfiles, and
          # the uniffi CLI is pinned by a version string that no lockfile in
          # this repository records, so a lockfile-keyed cache could not tell
          # that the pinned version had changed.
          #
          # The prefix differs from android-ci.yml's on purpose. Sharing a key
          # between the two jobs would have them evicting each other's entry, and
          # this job runs on a different cadence from the gate it calls.
          path: ~/.cargo/bin
          key: ${{ runner.os }}-release-cargo-bin-uniffi0.32.1-${{ hashFiles('komorei-sdk/Cargo.lock', 'komorei-sdk/crates/cli/**') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-bin-uniffi0.32.1-

      - name: Install native tooling
        run: |
          # The `uniffi-bindgen` binary ships in the `uniffi` crate (there is no
          # `uniffi-bindgen` package on crates.io, and `uniffi_bindgen` is a
          # binless library). The binary is behind the crate's `cli` feature, and
          # the version must stay in lockstep with the runner's `uniffi` dep.
          #
          # Skipped when the cache already restored them. `cargo install` is not
          # cheap and not additive: re-running it over a restored binary still
          # recompiles and reinstalls, so the guard is what actually saves the
          # time, not the cache.
          if ! command -v uniffi-bindgen >/dev/null 2>&1; then
            cargo install uniffi --version 0.32.1 --locked --features cli
          else
            echo "uniffi-bindgen already restored from cache"
          fi
          if ! command -v komorei >/dev/null 2>&1; then
            cargo install --path komorei-sdk/crates/cli --locked
          else
            echo "komorei CLI already restored from cache"
          fi

      - name: Build release fixtures
        run: |
          komorei package komorei-sdk/examples/example-source
          for source in sources/sources/*; do
            [ -d "$source" ] || continue
            [ -f "$source/.skip" ] && continue
            komorei package "$source"
          done

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Install semantic-release dependencies
        run: bun ci

      - name: Predict next release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output="$(bunx semantic-release \
            --dry-run \
            --no-ci \
            --branches main \
            --plugins \
              @semantic-release/commit-analyzer \
              @semantic-release/release-notes-generator 2>&1)"
          printf '%s\n' "$output"
          plain="$(printf '%s' "$output" | sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g')"
          version="$(printf '%s\n' "$plain" | sed -nE 's/.*next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | tail -n 1)"
          if [ -n "$version" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Gradle version properties
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path("gradle.properties")
          version = os.environ["NEW_RELEASE_VERSION"].removeprefix("v")
          version_code = 100000 + int(os.environ["GITHUB_RUN_NUMBER"])
          text = path.read_text()
          text = re.sub(r"^VERSION_NAME=.*$", f"VERSION_NAME={version}", text, flags=re.MULTILINE)
          text = re.sub(r"^VERSION_CODE=.*$", f"VERSION_CODE={version_code}", text, flags=re.MULTILINE)
          path.write_text(text)
          PY

      - name: Configure release signing
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_CONTENT"
          test -n "$KEYSTORE_ALIAS"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_CONTENT" | base64 --decode > "$RUNNER_TEMP/komorei-release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/komorei-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_ALIAS=$KEYSTORE_ALIAS" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Configure Google Drive OAuth
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$GOOGLE_ANDROID_CLIENT_ID"
          test -n "$GOOGLE_WEB_CLIENT_ID"
          echo "GOOGLE_ANDROID_CLIENT_ID=$GOOGLE_ANDROID_CLIENT_ID" >> "$GITHUB_ENV"
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> "$GITHUB_ENV"

      - name: Build signed AAB and APK
        if: steps.semantic.outputs.new_release_published == 'true'
        run: ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Verify release configuration
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          build_config="app/build/generated/source/buildConfig/release/git/shin/komorei/BuildConfig.java"
          test -f "$build_config"
          ! grep -q 'UNCONFIGURED' "$build_config"
          grep -q 'DRIVE_ANDROID_CLIENT_ID' "$build_config"
          grep -q 'DRIVE_WEB_CLIENT_ID' "$build_config"

      - name: Verify release signatures
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          aab="$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          # Upload keys are self-signed; -strict would reject their chain
          # before Android gets a chance to verify the APK/Bundle signature.
          jarsigner -verify "$aab"

      - name: Publish semantic release
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release
